[build-system]
build-backend = "cmeel"
requires = [
  "cmeel-boost[build] ~= 1.90.0",
  "cmeel[build]",
  "hpp-manipulation[build]"
]

[project]
dependencies = [
  "cmeel-boost ~= 1.90.0",
  "hpp-manipulation"
]
description = "Implementation of a parser for hpp-manipulation"
license = "BSD-2-Clause"
name = "hpp-manipulation-urdf"
version = "9.0.2"

[tool.cmeel]
has-sitelib = false

[tool.ruff.lint]
extend-select = ["I", "NPY", "RUF", "UP", "W"]

[tool.tomlsort]
all = true
